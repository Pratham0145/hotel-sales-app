<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Shallot Biriyani — Sales Book</title>
<link rel="icon" type="image/jpeg" href="assets/logo-horse.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="ticket-header">
    <div class="brand-row">

        <div class="brand-left">
            <img src="assets/brand-banner.jpg"
                 alt="The Shallot Biriyani"
                 class="brand-logo">

            <div class="brand-content">
                <div class="brand-eyebrow">Daily Sales Book</div>
                <h1>The Shallot Biriyani</h1>
            </div>
        </div>

        <div class="brand-right">
            <div class="sync-pill">
                <span class="sync-dot" id="syncDot"></span>
                <span id="syncText">Synced to server</span>
            </div>

            <button class="owner-lock-btn" id="ownerLockBtn">
                🔒 Owner Login
            </button>

            <img src="assets/logo-horse.jpg"
                 alt="Horse Logo"
                 class="logo-horse">
        </div>

    </div>
</div>

<div class="owner-modal-backdrop" id="ownerModalBackdrop">
  <div class="owner-modal">
    <div class="owner-modal-title">Owner Login</div>
    <div class="owner-modal-sub">Unlocks past dates for Food Truck / JP Nagar / Items Used, and the Amount &amp; Report tabs.</div>
    <input type="password" id="ownerPasswordInput" placeholder="Owner password" autocomplete="current-password">
    <div class="owner-modal-actions">
      <button class="cancel" id="ownerModalCancel">Cancel</button>
      <button class="submit" id="ownerModalSubmit">Unlock</button>
    </div>
    <div class="owner-modal-error" id="ownerModalError"></div>
  </div>
</div>

<div class="nav-wrap">
  <button class="nav-btn active" data-view="truck">🚚 Food Truck</button>
  <button class="nav-btn" data-view="jp">🏠 JP Nagar</button>
  <div class="nav-sep"></div>
  <button class="nav-btn owner" data-view="items">📦 Items Used</button>
  <button class="nav-btn owner" data-view="amount">💰 Amount</button>
  <button class="nav-btn owner" data-view="report">📊 Report</button>
  <button class="nav-btn owner" data-view="payment">💵 Payment</button>
</div>

<!-- Entry views: Food Truck, JP Nagar, Items Used all share this structure -->
<div class="view active" id="view-truck"><div class="app" id="app-truck"></div></div>
<div class="view" id="view-jp"><div class="app" id="app-jp"></div></div>
<div class="view" id="view-items"><div class="app" id="app-items"></div></div>

<!-- Owner report views (per-day, same calendar pattern as the entry views) -->
<div class="view" id="view-amount"><div class="app" id="app-amount"></div></div>
<div class="view" id="view-report"><div class="app" id="app-report"></div></div>
<div class="view" id="view-payment"><div class="app" id="app-payment"></div></div>

<div class="toast" id="toast"><span id="toastText">Saved</span></div>

<script src="app.js"></script>
</body>
</html>
